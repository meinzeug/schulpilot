name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: ruff check backend deploy scripts
      - name: Run complete backend partition
        run: python scripts/run_backend_shard.py --shard-index ${{ matrix.shard }} --shard-count 3 --receipt artifacts/backend-shard-${{ matrix.shard }}.json -- -q -x
      - name: Record collection and partition
        if: always()
        run: cat artifacts/backend-shard-${{ matrix.shard }}.json
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/schulpilot-flutter"
          test "$(git -C "$RUNNER_TEMP/schulpilot-flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/schulpilot-flutter/bin" >> "$GITHUB_PATH"
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter analyze --no-pub
      - working-directory: app
        run: flutter test --no-pub
      - working-directory: app
        run: flutter build web --release --no-pub --no-web-resources-cdn --csp
