name: schulpilot
description: SchuleSchlau – gemeinsam lernen, den Überblick behalten.
publish_to: none
version: 1.38.3+158
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: 1.6.0
  go_router: 18.0.2
  flutter_secure_storage: 11.2.0
  image_picker: 1.2.4
  image: 4.12.0
  intl: 0.20.3
  file_saver: 0.7.0
  file_selector: 1.1.0
  cupertino_icons: 2.0.0
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  url_launcher: 6.3.2
  crypto: 3.0.7
  flutter_math_fork: 0.7.4
  flutter_tts: 4.2.5
  speech_to_text: 7.5.0
  flutter_webrtc: 1.6.2+hotfix.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/google/
    - assets/folders/
    - assets/illustrations/
    - assets/fonts/Nunito-OFL.txt
    - assets/fonts/SpaceGrotesk-OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
