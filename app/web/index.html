<!DOCTYPE html>
<html lang="de">
<head>
<base href="$FLUTTER_BASE_HREF">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Schulpilot: Heftseiten fotografieren, Stoff verstehen und mit passenden Übungen weiterlernen. Ein eigener Lernraum für jedes Kind.">
<meta name="theme-color" content="#101E24">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>SCHULPILOT · Gemeinsam auf Kurs</title>
<style>
html,body{margin:0;min-height:100%;background:#101E24;color:#f5f7f8;font-family:system-ui,sans-serif}
#startup{display:grid;place-content:center;justify-items:center;min-height:100dvh;padding:24px;text-align:center;box-sizing:border-box}
#startup .brand-home{display:block;min-width:48px;min-height:48px;max-width:100%;border:0;background:transparent;animation:brand-arrive 650ms ease-out both}
#startup img{display:block;width:min(46vw,200px);max-width:100%;height:auto;margin:auto;background:transparent}
#startup h1{margin:16px 0 8px;font-size:clamp(24px,7vw,30px);letter-spacing:.08em;line-height:1.2}
#startup p{max-width:38ch;margin:8px auto;color:#b2bec4;font-size:15px;line-height:1.5}
a{color:#9ac2ff}
a:focus-visible{outline:3px solid #9ac2ff;outline-offset:6px}
@keyframes brand-arrive{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#startup .brand-home{animation:none;transform:none}}
@media(max-height:560px){#startup{padding:16px}#startup img{width:124px}#startup h1{margin-top:12px}}
</style>
</head>
<body>
<div id="startup">
  <a class="brand-home" href="/app" aria-label="Schulpilot öffnen"><img src="brand.png" width="512" height="512" alt=""></a>
  <h1>SCHULPILOT</h1>
  <p>Heftseiten fotografieren. Stoff verstehen. Gemeinsam weiterlernen.</p>
  <p role="status">Dein Lernraum wird geladen …</p>
</div>
<noscript>Bitte JavaScript aktivieren, um deinen Lernraum zu öffnen. <a href="/privacy">Datenschutz</a> · <a href="/bedingungen">Bedingungen</a> · <a href="/account-deletion">Konto löschen</a></noscript>
<script src="push_bootstrap.js"></script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
